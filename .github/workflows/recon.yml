name: Optimized Recon Pipeline

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Domain (ex: embark.net)'
        required: true
        default: 'embark.net'

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          
      - name: Install Subfinder
        run: go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          
      - name: Run Subfinder
        run: |
          subfinder -d ${{ github.event.inputs.target }} -o subs-raw.txt -silent
          # Adiciona o domínio raiz caso não venha
          echo "${{ github.event.inputs.target }}" >> subs-raw.txt
          sort -u -o subs-raw.txt subs-raw.txt
          
      - name: Upload Raw Subs
        uses: actions/upload-artifact@v4
        with:
          name: subs-raw
          path: subs-raw.txt

  resolve:
    needs: discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.1' }
        
      - uses: actions/download-artifact@v4
        with:
          name: subs-raw
          
      - name: Install DNS Tools & Resolvers
        run: |
          go install -v github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          # Baixa lista de resolvers públicos confiáveis para evitar bloqueio do DNS do GitHub
          wget -q https://raw.githubusercontent.com/trickest/resolvers/main/resolvers.txt -O resolvers.txt
          
      - name: Resolve Domains
        run: |
          # Usa resolvers customizados e tenta resolver. 
          cat subs-raw.txt | dnsx -r resolvers.txt -o subs-resolved.txt -silent -retry 3 -threads 50
          
      - name: Generate NOVOS_subdomains.txt
        run: |
          # Lógica para o NOVOS_subdomains: compara com um arquivo historico se existir
          if [ -f "old_subs.txt" ]; then
             comm -23 subs-resolved.txt old_subs.txt > NOVOS_subdomains.txt
          else
             cp subs-resolved.txt NOVOS_subdomains.txt
             echo "Arquivo old_subs.txt não encontrado. Salvando todos como novos."
          fi
          
      - name: Upload Resolved
        uses: actions/upload-artifact@v4
        with:
          name: subs-resolved
          path: |
            subs-resolved.txt
            NOVOS_subdomains.txt

  surface:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.1' }
        
      - uses: actions/download-artifact@v4
        with:
          name: subs-resolved
          
      - name: Install Naabu
        run: |
          sudo apt-get update && sudo apt-get install -y libpcap-dev
          go install -v github.com/projectdiscovery/naabu/v2/cmd/naabu@latest
          
      - name: Port Scan
        run: |
          naabu -list subs-resolved.txt -o open-ports.txt -silent -c 50 -rate 1000 -timeout 5
          
      - name: Upload Ports
        uses: actions/upload-artifact@v4
        with:
          name: open-ports
          path: open-ports.txt

  finalize:
    needs: surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.1' }
        
      - uses: actions/download-artifact@v4
        with:
          name: open-ports
          
      - name: Install HTTPX & Crawlers
        run: |
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/projectdiscovery/katana/cmd/katana@latest
          go install github.com/tomnomnom/waybackurls@latest
          go install github.com/hakluke/hakrawler@latest
          pip3 install uro
          
      - name: HTTPX (Live Hosts)
        run: |
          cat open-ports.txt | httpx -o live_hosts.txt -silent -threads 30 -timeout 10
          
      - name: Crawlers & ep.txt
        run: |
          if [ -s live_hosts.txt ]; then
            cat live_hosts.txt | katana -o katana.txt -silent -jc -d 2
            cat live_hosts.txt | waybackurls > wayback.txt
            cat live_hosts.txt | hakrawler -u > hakrawler.txt
            
            # Junta tudo, remove duplicatas e padrões inúteis com uro
            cat katana.txt wayback.txt hakrawler.txt 2>/dev/null | uro | sort -u > ep.txt
            
            # Remove arquivos individuais conforme solicitado
            rm -f katana.txt wayback.txt hakrawler.txt
          else
            touch ep.txt
          fi
          
      - name: JS Secret Hits (Exemplo)
        run: |
          touch js_secret_hits.txt
          if [ -s ep.txt ]; then
             # Filtro simples para JS e busca por palavras-chave (exemplo)
             cat ep.txt | grep -iE "\.js($|\?)" | httpx -silent -mc 200 -title -content-length | grep -iE "api|key|token|secret" > js_secret_hits.txt || true
          fi
          
      - name: Upload Final Results
        uses: actions/upload-artifact@v4
        with:
          name: recon-results
          path: |
            live_hosts.txt
            open-ports.txt
            ep.txt
            js_secret_hits.txt
            NOVOS_subdomains.txt
