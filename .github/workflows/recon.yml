name: Bug Bounty Recon - Multi-Alvos

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      alvo_manual:
        description: 'Alvo opcional (ex: opera.com). Vazio = usa targets.txt'
        required: false
        default: ''
      modo_completo:
        description: 'Forcar modo DEEP agora? (true/false)'
        required: false
        default: 'false'
      usar_cookie:
        description: 'Usar o cookie SALVO no secret RECON_COOKIE neste run? (true/false)'
        required: false
        default: 'false'
      cookie_manual:
        description: 'Cookie AVULSO so para este run (sobrescreve o secret). Vazio = ignora'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: recon-pipeline
  cancel-in-progress: false

jobs:
  # ═══════════════ JOB 1: DISCOVERY (passivo + brute) ═══════════════
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GOBIN_DIR: /home/runner/go/bin
      TARGET_MANUAL: ${{ github.event.inputs.alvo_manual }}
      MODO_COMPLETO: ${{ github.event.inputs.modo_completo }}
      GITHUB_TOKEN_RECON: ${{ secrets.RECON_PAT_TOKEN }}
      SUBFINDER_CONFIG: ${{ secrets.SUBFINDER_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            /home/runner/go/bin
            /home/runner/.cache/go-build
          key: gobin-v1-${{ runner.os }}
      - name: Deps + massdns
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq unzip libpcap-dev build-essential
          if ! command -v massdns >/dev/null; then
            curl -Lfs "https://github.com/blechschmidt/massdns/archive/refs/heads/master.tar.gz" -o /tmp/massdns.tar.gz
            tar -xzf /tmp/massdns.tar.gz -C /tmp
            make -C /tmp/massdns-master -j"$(nproc)" >/dev/null
            sudo cp /tmp/massdns-master/bin/massdns /usr/local/bin/massdns
          fi
      - name: API keys subfinder
        run: |
          mkdir -p ~/.config/subfinder
          [ -n "$SUBFINDER_CONFIG" ] && printf '%s\n' "$SUBFINDER_CONFIG" > ~/.config/subfinder/provider-config.yaml
      - name: Instalar ferramentas
        run: |
          [ -x "$GOBIN_DIR/subfinder" ]   || go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          [ -x "$GOBIN_DIR/shuffledns" ]  || go install -v github.com/projectdiscovery/shuffledns/cmd/shuffledns@latest
          [ -x "$GOBIN_DIR/github-subdomains" ] || go install -v github.com/gwen001/github-subdomains@latest
      - name: Cache wordlists
        uses: actions/cache@v4
        with:
          path: wordlists
          key: wordlists-v1
      - name: Baixar wordlists
        run: |
          mkdir -p wordlists
          [ -s wordlists/subdomains.txt ] || curl -sL --retry 3 -o wordlists/subdomains.txt \
            "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/subdomains-top1million-110000.txt"
          [ -s wordlists/resolvers.txt ] || curl -sL --retry 3 -o wordlists/resolvers.txt \
            "https://raw.githubusercontent.com/trickest/resolvers/main/resolvers.txt"
      - name: Discovery
        run: |
          clean() {
            sed -r 's/\x1b\[[0-9;]*[mK]//g' \
              | sed -E 's/^\[[0-9]{2}:[0-9]{2}:[0-9]{2}\][[:space:]]*//' \
              | tr 'A-Z' 'a-z' | sed '/^[[:space:]]*$/d' \
              | grep -E '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$' || true
          }
          mkdir -p work
          if [ -n "$TARGET_MANUAL" ]; then echo "$TARGET_MANUAL" > targets.txt; fi
          sed -i 's/\r$//; s/^[[:space:]]*//; s/[[:space:]]*$//; s|^[a-z]*://||; s/\*\.//g' targets.txt
          grep -vE '^(#|$)' targets.txt > work/t.tmp || true
          mv work/t.tmp targets.txt
          echo "== ALVOS ($(wc -l < targets.txt)) =="; cat targets.txt
          DEEP=0
          if [ "$MODO_COMPLETO" = "true" ] || [ "$(date -u +%u)" = "1" ]; then DEEP=1; fi
          echo "DEEP=$DEEP" | tee work/deep.flag

          subfinder -dL targets.txt -all -silent -t 50 -o work/passive_raw.txt || true
          clean < work/passive_raw.txt > work/passive.txt
          while read -r t; do
            [ -z "$t" ] && continue
            github-subdomains -d "$t" -t "$GITHUB_TOKEN_RECON" 2>/dev/null | clean >> work/passive.txt || true
          done < targets.txt
          echo "Passivo: $(wc -l < work/passive.txt)"

          if [ "$DEEP" = "1" ]; then
            while read -r t; do
              [ -z "$t" ] && continue
              echo "-> shuffledns: $t"
              timeout 5400 shuffledns -d "$t" -w wordlists/subdomains.txt -r wordlists/resolvers.txt \
                         -mode bruteforce -m /usr/local/bin/massdns -o "work/brute_${t}_raw.txt" || true
              [ -f "work/brute_${t}_raw.txt" ] && clean < "work/brute_${t}_raw.txt" >> work/brute_all.txt || true
            done < targets.txt
          fi
          cat work/passive.txt work/brute_all.txt 2>/dev/null | sort -u > work/subs_raw.txt
          echo "SUBS RAW: $(wc -l < work/subs_raw.txt)"
      - name: Upload subs-raw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subs-raw
          path: |
            work/subs_raw.txt
            work/deep.flag
            targets.txt
          retention-days: 3

  # ═══════════════ JOB 2: RESOLUCAO + PERMUTACOES ═══════════════
  resolve:
    needs: discovery
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GOBIN_DIR: /home/runner/go/bin
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            /home/runner/go/bin
            /home/runner/.cache/go-build
          key: gobin-v1-${{ runner.os }}
      - name: Instalar ferramentas
        run: |
          [ -x "$GOBIN_DIR/dnsx" ]   || go install -v github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          [ -x "$GOBIN_DIR/alterx" ] || go install -v github.com/projectdiscovery/alterx/cmd/alterx@latest
      - name: Download subs-raw
        uses: actions/download-artifact@v4
        with:
          name: subs-raw
          path: work/
      - name: Resolver + permutacoes
        run: |
          clean() {
            sed -r 's/\x1b\[[0-9;]*[mK]//g' \
              | sed -E 's/^\[[0-9]{2}:[0-9]{2}:[0-9]{2}\][[:space:]]*//' \
              | tr 'A-Z' 'a-z' | sed '/^[[:space:]]*$/d' \
              | grep -E '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$' || true
          }
          printf '1.1.1.1\n1.0.0.1\n8.8.8.8\n8.8.4.4\n9.9.9.9\n149.112.112.112\n208.67.222.222\n208.67.220.220\n' > work/resolvers_trusted.txt
          echo "== SANITY CHECK DNS =="
          printf 'example.com\ngithub.com\n' | dnsx -r work/resolvers_trusted.txt -silent -retry 3 || true
          DEEP=$(grep -o '1' work/deep.flag || echo 0)

          echo "== RESOLUCAO =="
          dnsx -l work/subs_raw.txt -r work/resolvers_trusted.txt -retry 3 -silent -o work/subs_live_raw.txt || true
          clean < work/subs_live_raw.txt > work/subs_live.txt
          echo "Resolvidos: $(wc -l < work/subs_live.txt) de $(wc -l < work/subs_raw.txt)"

          if [ "$DEEP" = "1" ] && [ -s work/subs_live.txt ]; then
            echo "== PERMUTACOES (alterx) =="
            echo "Input do alterx: $(wc -l < work/subs_live.txt) dominios"
            cat work/subs_live.txt | timeout 900 alterx -silent -o work/perms_all.txt \
              || timeout 900 alterx -l work/subs_live.txt -silent -o work/perms_all.txt || true
            if [ -s work/perms_all.txt ]; then
              echo "Permutacoes geradas: $(wc -l < work/perms_all.txt)"
              timeout 18000 dnsx -l work/perms_all.txt -r work/resolvers_trusted.txt -retry 3 -silent -o work/perms_live_raw.txt || true
              clean < work/perms_live_raw.txt > work/perms_live.txt
              echo "Permutacoes vivas: $(wc -l < work/perms_live.txt)"
            else
              echo "AVISO: alterx nao gerou permutacoes"
              touch work/perms_live.txt
            fi
          fi
          cat work/subs_live.txt work/perms_live.txt 2>/dev/null | sort -u > subdomains.txt
          echo "SUBDOMINIOS FINAIS: $(wc -l < subdomains.txt)"
          # repassa o targets.txt p/ frente (raizes corretas do Wayback)
          cp work/targets.txt targets.txt 2>/dev/null || touch targets.txt
      - name: Upload subs-live
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subs-live
          path: |
            subdomains.txt
            targets.txt
          retention-days: 3

  # ═══════════════ JOB 3: PORTAS + HTTP + CONTENT ═══════════════
  surface:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GOBIN_DIR: /home/runner/go/bin
      MODO_COMPLETO: ${{ github.event.inputs.modo_completo }}
      STORED_COOKIE: ${{ secrets.RECON_COOKIE }}
      USAR_COOKIE: ${{ github.event.inputs.usar_cookie }}
      COOKIE_MANUAL: ${{ github.event.inputs.cookie_manual }}
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            /home/runner/go/bin
            /home/runner/.cache/go-build
          key: gobin-v1-${{ runner.os }}
      - name: Instalar ferramentas
        run: |
          [ -x "$GOBIN_DIR/naabu" ]       || go install -v github.com/projectdiscovery/naabu/v2/cmd/naabu@latest
          [ -x "$GOBIN_DIR/httpx" ]       || go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          [ -x "$GOBIN_DIR/katana" ]      || go install -v github.com/projectdiscovery/katana/cmd/katana@latest
          [ -x "$GOBIN_DIR/waybackurls" ] || go install -v github.com/tomnomnom/waybackurls@latest
          [ -x "$GOBIN_DIR/hakrawler" ]   || go install -v github.com/hakluke/hakrawler@latest
          command -v uro >/dev/null || pip3 install --quiet uro
      - name: Download subs-live
        uses: actions/download-artifact@v4
        with:
          name: subs-live
          path: work/
      - name: Portas + HTTP + Content
        run: |
          mkdir -p out
          cp work/subdomains.txt out/subdomains.txt
          # Raizes p/ Wayback: targets.txt reais (ccTLD-safe); fallback heuristico
          if [ -s work/targets.txt ]; then
            cp work/targets.txt out/wayback_roots.txt
          else
            awk -F. '{ if ($(NF-1) ~ /^(com|net|org|gov|edu|co|gob)$/ && NF>=3) print $(NF-2)"."$(NF-1)"."$NF; else print $(NF-1)"."$NF }' \
              out/subdomains.txt | sort -u > out/wayback_roots.txt
          fi
          echo "== RAIZES WAYBACK =="; cat out/wayback_roots.txt
          DEEP=0
          if [ "$MODO_COMPLETO" = "true" ] || [ "$(date -u +%u)" = "1" ]; then DEEP=1; fi

          if [ "$DEEP" = "1" ] && [ -s out/subdomains.txt ]; then
            timeout 12000 naabu -l out/subdomains.txt -top-ports 1000 -ep 22,23,3389 \
                  -c 50 -rate 1500 -silent -o out/open-ports.txt || true
            cat out/open-ports.txt out/subdomains.txt | sort -u > work/httpx_in.txt
          else
            cp out/subdomains.txt work/httpx_in.txt
          fi
          if [ -s work/httpx_in.txt ]; then
            httpx -l work/httpx_in.txt -ports 80,443,8000,8080,8443,8888 \
                  -title -sc -cl -td -server -location -fr -fc 404 \
                  -threads 50 -timeout 10 -retries 1 -silent -o out/live_hosts.txt || true
          else
            touch out/live_hosts.txt
          fi
          awk '{print $1}' out/live_hosts.txt | sort -u > out/live_urls.txt
          echo "Hosts vivos: $(wc -l < out/live_urls.txt)"

          if [ -s out/live_urls.txt ] || [ -s out/subdomains.txt ]; then
            # ── COOKIE: manual > secret (se usar_cookie=true) > anonimo ──
            COOKIE=""
            if [ -n "$COOKIE_MANUAL" ]; then
              COOKIE="$COOKIE_MANUAL"
            elif [ "$USAR_COOKIE" = "true" ]; then
              COOKIE="$STORED_COOKIE"
            fi
            if [ "$DEEP" = "1" ] && [ -s out/live_urls.txt ]; then
              if [ -n "$COOKIE" ]; then
                echo "::add-mask::$COOKIE"
                echo "Katana: crawl AUTENTICADO"
                timeout 12000 katana -list out/live_urls.txt -depth 3 -c 10 -aff -jsl -xhr \
                       -kf robotstxt,sitemapxml -timeout 10 -silent \
                       -H "Cookie: $COOKIE" -o out/katana.txt || true
              else
                echo "Katana: crawl ANONIMO"
                timeout 12000 katana -list out/live_urls.txt -depth 3 -c 10 -aff -jsl -xhr \
                       -kf robotstxt,sitemapxml -timeout 10 -silent -o out/katana.txt || true
              fi
            fi

            echo "== WAYBACK (CDX matchType=domain por raiz) =="
            : > out/wayback.txt
            while read -r root; do
              [ -z "$root" ] && continue
              curl -s --retry 3 --retry-delay 2 --max-time 300 \
                "https://web.archive.org/cdx/search/cdx?url=${root}/*&matchType=domain&output=text&fl=original&collapse=urlkey&limit=50000" \
                >> out/wayback.txt || true
              sleep 2
            done < out/wayback_roots.txt
            sort -u out/wayback.txt -o out/wayback.txt
            echo "Wayback URLs: $(wc -l < out/wayback.txt)"
            if [ ! -s out/wayback.txt ] && [ -s out/subdomains.txt ]; then
              timeout 2400 waybackurls -threads 2 < out/subdomains.txt > out/wayback.txt 2>work/wayback_err.log || true
              [ -s work/wayback_err.log ] && head -n 3 work/wayback_err.log || true
            fi

            if [ -s out/live_urls.txt ]; then
              timeout 5400 hakrawler -d 3 -t 20 -u -subs < out/live_urls.txt > out/hakrawler.txt 2>/dev/null || true
            else
              touch out/hakrawler.txt
            fi
            echo "Hakrawler URLs: $(wc -l < out/hakrawler.txt)"

            cat out/katana.txt out/wayback.txt out/hakrawler.txt 2>/dev/null | sed '/^[[:space:]]*$/d' | sort -u > work/merged.txt
            uro -l work/merged.txt -o out/all_endpoints.txt || cp work/merged.txt out/all_endpoints.txt
          else
            touch out/all_endpoints.txt out/wayback.txt out/hakrawler.txt out/katana.txt
          fi
          echo "Endpoints: $(wc -l < out/all_endpoints.txt)"
      - name: Upload surface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface
          path: out/
          retention-days: 3

  # ═══════════════ JOB 4: JS + DIFF + PUSH + TELEGRAM ═══════════════
  finalize:
    needs: surface
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOBIN_DIR: /home/runner/go/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - uses: actions/cache@v4
        with:
          path: /home/runner/go/bin
          key: gobin-v1-${{ runner.os }}
      - name: Instalar httpx
        run: |
          [ -x "$GOBIN_DIR/httpx" ] || go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
      - name: Download surface
        uses: actions/download-artifact@v4
        with:
          name: surface
          path: resultados/
      - name: JS + diff + push
        run: |
          mkdir -p resultados/js
          grep -iE '\.js(\?|$|#|&)' resultados/all_endpoints.txt 2>/dev/null | sort -u > resultados/js_files.txt || touch resultados/js_files.txt
          echo "JS files: $(wc -l < resultados/js_files.txt)"
          if [ -s resultados/js_files.txt ]; then
            head -n 500 resultados/js_files.txt | httpx -threads 20 -timeout 10 -silent -sr -sd resultados/js || true
            grep -rEioh "(api[_-]?key|secret|token|aws_access_key_id|private_key|bearer)[\"':= ]+[A-Za-z0-9_\-/+]{8,}" \
              resultados/js 2>/dev/null | sort -u | head -n 200 > resultados/js_secret_hits.txt || true
          fi
          mkdir -p /tmp/prev
          for f in subdomains.txt all_endpoints.txt; do
            git show "HEAD:resultados/$f" > "/tmp/prev/$f" 2>/dev/null || touch "/tmp/prev/$f"
          done
          comm -13 <(sort -u /tmp/prev/subdomains.txt) <(sort -u resultados/subdomains.txt) > resultados/NOVOS_subdomains.txt
          comm -13 <(sort -u /tmp/prev/all_endpoints.txt) <(sort -u resultados/all_endpoints.txt) > resultados/NOVOS_endpoints.txt
          {
            echo "## Recon $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- Subdominios vivos: $(wc -l < resultados/subdomains.txt)"
            echo "- **NOVOS subdominios**: $(wc -l < resultados/NOVOS_subdomains.txt)"
            echo "- **NOVOS endpoints**: $(wc -l < resultados/NOVOS_endpoints.txt)"
            echo "- Hosts vivos: $(wc -l < resultados/live_urls.txt)"
            echo "- Endpoints: $(wc -l < resultados/all_endpoints.txt)"
            echo "- Wayback URLs: $(wc -l < resultados/wayback.txt)"
            echo "- JS files: $(wc -l < resultados/js_files.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.email "actions@github.com"
          git config user.name "Recon Bot"
          git add resultados/ ":(exclude)resultados/js"
          if git diff --cached --quiet; then
            echo "Sem alteracoes."
          else
            git commit -m "recon: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Notificacao Telegram
        if: always()
        env:
          TELEGRAM_TOKEN: "8830303342:AAGvbkgzp0cJrBWjAfCrz11AHL7Cj1DsRrQ"
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_CHAT_ID nao configurado - pulando."
            exit 0
          fi
          NOVOS_SUBS=$(wc -l < resultados/NOVOS_subdomains.txt 2>/dev/null || echo 0)
          NOVOS_ENDS=$(wc -l < resultados/NOVOS_endpoints.txt 2>/dev/null || echo 0)
          TOTAL_SUBS=$(wc -l < resultados/subdomains.txt 2>/dev/null || echo 0)
          HOSTS_VIVOS=$(wc -l < resultados/live_urls.txt 2>/dev/null || echo 0)
          TOTAL_ENDS=$(wc -l < resultados/all_endpoints.txt 2>/dev/null || echo 0)
          JS_FILES=$(wc -l < resultados/js_files.txt 2>/dev/null || echo 0)
          WAYBACK=$(wc -l < resultados/wayback.txt 2>/dev/null || echo 0)
          MSG="🚀 *Recon Finalizado*%0A"
          MSG+="📅 $(date -u '+%Y-%m-%d %H:%M UTC')%0A%0A"
          MSG+="📦 *Subdomínios Totais*: ${TOTAL_SUBS}%0A"
          MSG+="🔥 *NOVOS Subdomínios*: ${NOVOS_SUBS}%0A"
          MSG+="🔗 *NOVOS Endpoints*: ${NOVOS_ENDS}%0A%0A"
          MSG+="🌐 *Hosts Vivos*: ${HOSTS_VIVOS}%0A"
          MSG+="📂 *Total Endpoints*: ${TOTAL_ENDS}%0A"
          MSG+="🗄 *Wayback URLs*: ${WAYBACK}%0A"
          MSG+="📜 *JS Files*: ${JS_FILES}%0A"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="${MSG}" || echo "Falha ao enviar Telegram"
      - name: Upload artifact final
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ github.run_number }}
          path: resultados/
          retention-days: 7
